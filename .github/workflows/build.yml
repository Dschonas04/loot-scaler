name: Build

# Builds the mod on every push and pull request. A tag v* (or a manual run
# with a tag) also publishes a GitHub release with the jar and the matching
# section of CHANGELOG.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v1.0.0); leave empty for a plain build
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current
      - name: Minecraft server jar and Fabric API modules
        run: tools/fetch-libs.sh
      - name: Build
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: loot-scaler
          path: build/libs/*.jar

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: loot-scaler
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          # the section of CHANGELOG.md for this version, without its heading
          awk -v v="$version" '/^## /{p = index($0, "[" v "]") > 0; next} p && !/^\[[^]]*\]: /' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/loot-scaler-"$version".jar --clobber
          else
            gh release create "$TAG" dist/loot-scaler-"$version".jar --title "Loot Scaler $version" --notes-file notes.md
          fi
