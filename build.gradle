// Minecraft 26.2 ships with readable class names, so this mod is compiled straight
// against the server jar — no mappings, no remapping step, plain Gradle.
//
//   gradle build -Pminecraft_jar=/path/to/server-26.2.jar
//
// The jar it produces goes into the mods directory as it is.
plugins {
    id 'java'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    maven { name = 'Minecraft libraries'; url = 'https://libraries.minecraft.net' }
}

def minecraftJar = file(project.findProperty('minecraft_jar') ?: 'libs/server.jar')

dependencies {
    compileOnly files(minecraftJar)
    compileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly "net.fabricmc:sponge-mixin:${project.mixin_version}"
    compileOnly "org.slf4j:slf4j-api:2.0.16"
    // Minecraft's own classes carry JSpecify annotations, and their signatures reach into
    // these libraries, so javac needs them on the path even though we never call them.
    compileOnly "org.jspecify:jspecify:1.0.0"
    compileOnly "it.unimi.dsi:fastutil:${project.fastutil_version}"
    compileOnly "com.mojang:datafixerupper:${project.datafixerupper_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.named('compileJava') {
    doFirst {
        if (!minecraftJar.exists()) {
            throw new GradleException("Minecraft jar not found at ${minecraftJar}. " +
                    "Pass -Pminecraft_jar=/path/to/server-<version>.jar, " +
                    "or drop the jar into libs/server.jar")
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    archiveBaseName = project.archives_base_name
    from('LICENSE') { rename { "${it}_${project.archives_base_name}" } }
    manifest {
        attributes 'Implementation-Title': 'Loot Scaler',
                   'Implementation-Version': project.version
    }
}
