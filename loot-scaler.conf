# loot-scaler — how much loot ores and mobs should still give.
#
# Every value is a multiplier, not a percentage: 1.0 keeps vanilla, 0.7 means
# "70 % of what it used to be". Amounts are scaled, never the chance to drop —
# a block or a mob that always gave something still always gives something.

# Ores that drop several items at once: redstone, lapis, copper, amethyst,
# nether gold, and whatever a mod adds. Ores that give exactly one item — coal,
# iron, gold, diamond, emerald — are already at the minimum and stay untouched.
ores = 0.7

# How much of the Fortune bonus on ores remains. This is the dial for ores that
# drop a single item: at 0.7 Fortune still pays off, just less.
ore_fortune = 0.7

# Everything a creature drops when it dies, including its equipment.
mobs = 0.7

# Never let scaling turn a guaranteed drop into nothing. Leave this on unless
# you really want empty ores.
never_zero = true

# Should the loot tables of mods be scaled too, or only the vanilla ones?
include_mods = true

# Tables to leave alone, comma separated.
exclude = minecraft:entities/ender_dragon, minecraft:entities/wither

# Single tables can get their own multiplier, which wins over the values above.
# Example: table.minecraft:blocks/ancient_debris = 0.5
# Example: table.minecraft:entities/enderman = 1.0
