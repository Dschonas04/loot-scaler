# loot-scaler — how much loot ores and mobs should still drop.
#
# 1.0 keeps vanilla rates, 0.7 means "70 % of what it used to be", 0 means nothing.
# Every value is a multiplier, not a percentage.

# Ores: coal, iron, gold, diamond, copper, lapis, redstone, quartz, ancient debris,
# their deepslate variants, and any ore a mod adds.
ores = 0.7

# Mobs: everything a creature drops when it dies, including its equipment.
mobs = 0.7

# Should the loot tables of mods be scaled too, or only the vanilla ones?
include_mods = true

# Tables to leave alone, comma separated. Useful for boss drops or quest items.
# Example: exclude = minecraft:entities/ender_dragon, minecraft:entities/wither
exclude = minecraft:entities/ender_dragon, minecraft:entities/wither

# Single tables can get their own multiplier, which wins over the two above.
# Example: table.minecraft:blocks/ancient_debris = 0.5
# Example: table.minecraft:entities/enderman = 1.0
